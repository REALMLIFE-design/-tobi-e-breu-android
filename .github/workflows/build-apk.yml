
name: Build Tobi e Breu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Aceitar licenças Android
        run: yes | sdkmanager --licenses

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair versão 0.2
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*v2*.zip' | head -n1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: Não encontrei o ZIP v2 na raiz."
            exit 1
          fi

          echo "Usando arquivo: $ZIP"
          mkdir projeto
          unzip -q "$ZIP" -d projeto

          SETTINGS=$(find projeto \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Construir APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Tobi-e-Breu-APK-v0.2
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
