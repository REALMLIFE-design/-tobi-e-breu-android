name: Build Tobi e Breu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          ZIP=$(find . -maxdepth 1 -iname 'TobiEBreu-Android*.zip' -type f | head -n1)
          test -n "$ZIP" || exit 1
          mkdir projeto
          unzip -q "$ZIP" -d projeto
          SETTINGS=$(find projeto -name settings.gradle -o -name settings.gradle.kts | head -n1)
          test -n "$SETTINGS" || exit 1
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Construir APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Tobi-e-Breu-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
